services:
  postgres:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    container_name: beacon_db
    env_file:
      - packages/db/.env
    ports:
      - '5432:5432'
    volumes:
      - beacon_postgres_data:/var/lib/postgresql/data
    command:
      - -c
      - max_wal_size=2GB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - packages/db/.env
    environment:
      - DOCKER_ENV=true
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        export DATABASE_URL=postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres:5432/$$POSTGRES_DB?schema=public &&
        apk add --no-cache openssl &&
        npm install -g pnpm@9.2.0 &&
        pnpm install --frozen-lockfile &&
        echo 'Waiting for database to be ready...' &&
        pnpm exec prisma migrate deploy --schema=./packages/db/prisma/schema.prisma &&
        echo 'Database migration completed successfully!'
      "
    networks:
      - app-network

  indexer:
    container_name: indexer
    restart: on-failure
    env_file:
      - packages/indexer/.env
    environment:
      - DOCKER_ENV=true
      - LOG_DIR=/app/logs
    build:
      context: .
      dockerfile: packages/indexer/Dockerfile
    volumes:
      - ./packages/indexer/logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  api:
    container_name: api
    restart: on-failure
    env_file:
      - packages/api/.env
    environment:
      - DOCKER_ENV=true
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    networks:
      - app-network

  netdata:
    image: netdata/netdata
    container_name: netdata
    restart: unless-stopped
    pid: host
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/host/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # telegram_bot:
  #   container_name: telegram_bot
  #   restart: on-failure
  #   env_file:
  #     - .env
  #     - packages/telegram-bot/.env
  #   environment:
  #     - DOCKER_ENV=true
  #   build:
  #     context: .
  #     dockerfile: packages/telegram-bot/Dockerfile
  #     platforms:
  #       - linux/arm64
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  beacon_postgres_data:
  netdataconfig:
  netdatalib:
  netdatacache:
