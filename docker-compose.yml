services:
  postgres:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    container_name: beacon_db
    env_file:
      - packages/db/.env
    ports:
      - '5432:5432'
    volumes:
      - beacon_postgres_data:/var/lib/postgresql/data
    command:
      - -c
      - max_wal_size=2GB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - packages/db/.env
    environment:
      - DATABASE_URL=postgresql://beacon_user:beacon_password@postgres:5432/dev_beacon?schema=public
      - DOCKER_ENV=true
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        apk add --no-cache openssl &&
        npm install -g pnpm@9.2.0 &&
        pnpm install --frozen-lockfile &&
        echo 'Waiting for database to be ready...' &&
        pnpm exec prisma migrate deploy --schema=./packages/db/prisma/schema.prisma &&
        echo 'Database migration completed successfully!'
      "
    networks:
      - app-network

  indexer:
    container_name: indexer
    restart: on-failure
    env_file:
      - packages/indexer/.env
    environment:
      - DOCKER_ENV=true
    build:
      context: .
      dockerfile: packages/indexer/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  api:
    container_name: api
    restart: on-failure
    env_file:
      - packages/api/.env
    environment:
      - DOCKER_ENV=true
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    networks:
      - app-network

  # telegram_bot:
  #   container_name: telegram_bot
  #   restart: on-failure
  #   env_file:
  #     - .env
  #     - packages/telegram-bot/.env
  #   environment:
  #     - DOCKER_ENV=true
  #   build:
  #     context: .
  #     dockerfile: packages/telegram-bot/Dockerfile
  #     platforms:
  #       - linux/arm64
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  beacon_postgres_data:
