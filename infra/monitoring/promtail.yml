server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: indexer-xstate-traces
    static_configs:
      - targets:
          - localhost
        labels:
          job: indexer-xstate-traces
          app: beacon-chain-validators-monitor
          __path__: /var/log/indexer/xstate-traces.ndjson
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            kind: kind
            message: message
            machine_group: machineGroup
            machine_name: machineName
            task: task
            trace_id: traceId
            parent_span_id: parentSpanId
            duration_ms: durationMs
            reason: reason
            epoch: payload.epoch
            slot: payload.slot
            start_slot: payload.startSlot
            end_slot: payload.endSlot
            current_slot: payload.currentSlot
            lookback_slot: payload.lookbackSlot
      - labels:
          machine_group:
          machine_name:
          kind:
      - output:
          source: message
